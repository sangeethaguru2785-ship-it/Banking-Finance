<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Stackly</title>
    <meta name="description" content="Oops! The page you're looking for can't be found. Head back to Stackly's home page or explore our banking services.">
    <link rel="shortcut icon" href="https://img.icons8.com/fluency/48/bank-cards.webp" type="image/webp">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- AOS (Animate On Scroll) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ================== 404 SECTION ================== -->
    <section class="error-section">
        <div class="error-shape error-shape-a"></div>
        <div class="error-shape error-shape-b"></div>

        <div class="container">
            <a href="index.html" class="error-logo" aria-label="Stackly Home" data-aos="fade-up">
                <img src="images/logo-red.webp" alt="Stackly" class="brand-logo error-logo-img">
            </a>
            <div class="error-404-wrap" data-aos="fade-up">
                <figure class="error-404">
                    <span>4</span><span class="error-zero">0</span><span>4</span>
                </figure>
                <span class="error-status-badge">Error 404</span>
            </div>
            <div data-aos="fade-up" data-aos-delay="100">
                <h1 class="error-title">
                    This Page Seems to Have <span class="text-gradient-light">Gone Missing</span>
                </h1>
                <p class="error-subtitle">
                    The page you're looking for doesn't exist, was moved, or is temporarily unavailable. Your funds are safe — let's get you back on track.
                </p>
                <div class="error-actions">
                    <a href="javascript:history.back()" class="btn btn-glass btn-lg">
                        <i class="bi bi-arrow-left me-2"></i>Go Back
                    </a>
                    <a href="index.html" class="btn btn-primary-gradient btn-lg">
                        <i class="bi bi-house-door-fill me-2"></i>Back to Home
                    </a>
                    <a href="contact.html" class="btn btn-glass btn-lg">
                        <i class="bi bi-headset me-2"></i>Contact Support
                    </a>
                </div>
                <p class="error-help">
                    Need help finding something? <a href="contact.html">Chat with us</a> — we're available 24/7.
                </p>
            </div>
        </div>
    </section>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- AOS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
